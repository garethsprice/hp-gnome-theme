# HP brand palette for tmux (matches the Ghostty "HP" theme)
#   Electric Blue #0096D6 · Deep Blue #004D6E · Pale Gray #E2E8EC
#   Near-black #1A1E22 · Dark Gray #3D4A52
# Colours are hex, not names: tmux's "white" is ANSI colour 7, which the theme sets to Mid Gray.
set -g status-style "bg=#0096D6,fg=#FFFFFF"
set -g window-status-current-style "bg=#1A1E22,fg=#FFFFFF,bold"
set -g window-status-activity-style "bg=#0096D6,fg=#1A1E22"
set -g pane-border-style "fg=#3D4A52"
set -g pane-active-border-style "fg=#0096D6"
set -g message-style "bg=#004D6E,fg=#FFFFFF"
set -g message-command-style "bg=#004D6E,fg=#E2E8EC"
set -g mode-style "bg=#004D6E,fg=#FFFFFF"
set -g display-panes-active-colour "#0096D6"
set -g display-panes-colour "#E2E8EC"
set -g clock-mode-colour "#0096D6"
